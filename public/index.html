<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUBHE 智慧安防需求配置</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">DUBHE Security</div>
        <h1>智慧安防需求配置</h1>
      </div>
      <div class="top-actions">
        <button class="ghost" id="newProjectBtn" type="button">新建</button>
        <div class="export-combo">
          <button class="ghost" id="exportMenuBtn" type="button" aria-expanded="false">导出</button>
          <div class="export-menu" id="exportMenu" hidden>
            <button type="button" id="exportCsvBtn">CSV 文件</button>
            <button type="button" id="exportJsonBtn">JSON 文件</button>
            <button type="button" id="exportWordBtn">客户确认版 Word</button>
          </div>
        </div>
        <button class="primary" id="saveBtn" type="button">保存</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="panel">
          <div class="panel-title">填写进度</div>
          <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="progress-text" id="progressText">准备中</div>
          <ul class="checklist" id="completionList"></ul>
        </div>

        <div class="panel">
          <div class="panel-title">填写路径</div>
          <nav class="side-nav">
            <a href="#cameraCard">1. 摄像头组</a>
            <a href="#conditionsCard">2. 整体约束</a>
            <a href="#attachmentCard">3. 上传附件</a>
          </nav>
        </div>

        <div class="panel">
          <div class="panel-title">已有草稿</div>
          <div id="projectList" class="project-list"></div>
        </div>
      </aside>

      <section class="content">
        <section class="card" id="cameraCard">
          <div class="section-heading">
            <span class="step">01</span>
            <div>
              <h2>摄像头组与功能选择</h2>
              <p>摄像头型号及用途相同放在同一组，若有差异则新增另一组。</p>
            </div>
          </div>
          <div class="group-list" id="cameraGroupList"></div>
          <button class="add-group-large" id="addGroupLargeBtn" type="button">
            <span>+</span>
            <strong>新增另一组摄像头</strong>
          </button>
        </section>

        <section class="card" id="conditionsCard">
          <div class="section-heading compact">
            <span class="step">02</span>
            <div>
              <h2>整体约束</h2>
              <p>以下信息影响 AI 接入、数据安全和系统对接；不确定时可选择待确认。</p>
            </div>
          </div>
          <form class="grid-form compact-form" id="conditionsForm">
            <label>系统网络环境
              <select data-condition="internetPolicy">
                <option value="">请选择</option>
                <option>可访问互联网</option>
                <option>仅内网</option>
                <option>需审批后访问外网</option>
                <option>完全离线</option>
                <option>待确认</option>
              </select>
            </label>
            <label>AI方式限制
              <select data-condition="aiPolicy">
                <option value="">请选择</option>
                <option>可调用外部AI服务</option>
                <option>本地优先</option>
                <option>只能本地</option>
                <option>待确认</option>
              </select>
            </label>
            <label>数据安全/保密要求<input data-condition="compliance" placeholder="没有可写无；有要求请简述" /></label>
            <label>消息通知对接<input data-condition="messageIntegration" placeholder="企业微信 / 钉钉 / 飞书 / 短信 / 不需要" /></label>
            <label>业务系统对接<input data-condition="systemIntegration" placeholder="OA / 工单 / 安防平台 / 不需要" /></label>
            <label class="span-2">其他说明<textarea data-condition="extraNotes" placeholder="标准菜单外的识别目标、特殊流程或补充说明"></textarea></label>
          </form>
        </section>

        <section class="card attachment-card" id="attachmentCard">
          <div class="section-heading compact">
            <span class="step">03</span>
            <div>
              <h2>上传附件</h2>
              <p>可上传现场平面图、摄像头清单或其他资料。</p>
            </div>
          </div>
          <div class="attachment-row">
            <input id="fileInput" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.zip,.rar" />
            <button class="ghost" id="uploadBtn" type="button">上传附件</button>
          </div>
          <p class="attachment-note">支持图片、PDF、Office、CSV、TXT、压缩包，单个文件不超过 20MB。</p>
          <div id="attachmentList" class="attachment-list"></div>
        </section>
      </section>
    </main>

    <template id="emptyGroupTemplate">
      <div class="empty-state">
        <h3>还没有摄像头组</h3>
        <p>从下方新增第一组摄像头。</p>
      </div>
    </template>

    <div class="toast" id="toast"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
